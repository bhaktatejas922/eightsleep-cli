[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eight-sleep-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
eight = "eight_sleep_cli.cli:app"

[tool.setuptools.packages.find]
include = ["eight_sleep_cli*"]
